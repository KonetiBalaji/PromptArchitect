apiVersion: v1
kind: Secret
metadata:
  name: prompt-architect-secrets
  namespace: prompt-architect
type: Opaque
data:
  # Base64 encoded values - replace with actual values
  database-url: cG9zdGdyZXNxbDovL3Bvc3RncmVzOnBhc3N3b3JkQHBvc3RncmVzOjU0MzIvcHJvbXB0X2FyY2hpdGVjdA==
  redis-url: cmVkaXM6Ly9yZWRpczozNjc5LzA=
  openai-api-key: eW91ci1vcGVuYWktYXBpLWtleS1oZXJl
  anthropic-api-key: eW91ci1hbnRocm9waWMtYXBpLWtleS1oZXJl
  google-api-key: eW91ci1nb29nbGUtYXBpLWtleS1oZXJl
  secret-key: eW91ci1zZWNyZXQta2V5LWhlcmU=

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prompt-architect-config
  namespace: prompt-architect
data:
  config.yaml: |
    # Application configuration
    app:
      name: "Visionary Prompt Architect"
      version: "1.0.0"
      debug: false
    
    # Database configuration
    database:
      url: "postgresql://postgres:password@postgres:5432/prompt_architect"
      pool_size: 10
      max_overflow: 20
    
    # Redis configuration
    redis:
      url: "redis://redis:6379/0"
      max_connections: 10
    
    # LLM configuration
    llm:
      providers:
        openai:
          enabled: true
          models:
            - "gpt-4o"
            - "gpt-4o-mini"
            - "o1-preview"
        claude:
          enabled: true
          models:
            - "claude-3-5-sonnet-20241022"
            - "claude-3-haiku-20240307"
        gemini:
          enabled: true
          models:
            - "gemini-1.5-pro"
            - "gemini-1.5-flash"
    
    # Monitoring configuration
    monitoring:
      enabled: true
      prometheus:
        enabled: true
        port: 9090
      grafana:
        enabled: true
        port: 3000
    
    # Security configuration
    security:
      jwt_secret: "your-jwt-secret-here"
      rate_limiting:
        enabled: true
        requests_per_minute: 60
        requests_per_hour: 1000
