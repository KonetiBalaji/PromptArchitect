# Visionary Prompt Architect - Kubernetes Deployment
# Author: Balaji Koneti

apiVersion: apps/v1
kind: Deployment
metadata:
  name: prompt-architect-api
  namespace: prompt-architect
  labels:
    app: prompt-architect-api
    version: v1.0.0
spec:
  replicas: 3
  selector:
    matchLabels:
      app: prompt-architect-api
  template:
    metadata:
      labels:
        app: prompt-architect-api
        version: v1.0.0
    spec:
      containers:
      - name: prompt-architect-api
        image: prompt-architect:latest
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: prompt-architect-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: prompt-architect-secrets
              key: redis-url
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: prompt-architect-secrets
              key: openai-api-key
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: prompt-architect-secrets
              key: anthropic-api-key
        - name: GOOGLE_API_KEY
          valueFrom:
            secretKeyRef:
              name: prompt-architect-secrets
              key: google-api-key
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: prompt-architect-secrets
              key: secret-key
        - name: ENVIRONMENT
          value: "production"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: logs
        emptyDir: {}
      restartPolicy: Always
      terminationGracePeriodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: prompt-architect-api-service
  namespace: prompt-architect
  labels:
    app: prompt-architect-api
spec:
  selector:
    app: prompt-architect-api
  ports:
  - name: http
    port: 80
    targetPort: 8000
    protocol: TCP
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: prompt-architect-api-loadbalancer
  namespace: prompt-architect
  labels:
    app: prompt-architect-api
spec:
  selector:
    app: prompt-architect-api
  ports:
  - name: http
    port: 80
    targetPort: 8000
    protocol: TCP
  type: LoadBalancer

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: prompt-architect-api-hpa
  namespace: prompt-architect
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: prompt-architect-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
